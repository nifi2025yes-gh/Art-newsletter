name: Museum Newsletter Automated Test & Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # GitHub에서 버튼 클릭으로 수동 테스트 실행 가능
  schedule:
    # 매일 한국시간(KST) 오전 8시 실행 (UTC 기준 23:00)
    - cron: '0 23 * * *'

jobs:
  test-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 불러오기 (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 의존성 패키지 및 Playwright 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 단위 테스트 실행 (Pytest)
        run: |
          python -m pytest tests/
        env:
          PYTHONPATH: .

      - name: 미술관 뉴스레터 수집 및 메일 발송 (Main Pipeline)
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python main.py
